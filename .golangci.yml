version: "2"

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - misspell
    - unconvert
  settings:
    errcheck:
      check-blank: false
    staticcheck:
      checks: ["all"]

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: true
    goimports:
      local-prefixes:
        - tidepool

run:
  timeout: 5m
  tests: true
