# Declarative follow list: every Lemmy community this Tidepool instance
# bridges. Deploys point FOLLOW_LIST_PATH at this file; the reconciler
# converges subscriptions to it on startup and every FOLLOW_LIST_INTERVAL
# (default 15m), and POST /admin/communities/reconcile forces a pass.
#
# THIS FILE IS AUTHORITATIVE while FOLLOW_LIST_PATH is set:
#   - adding an entry subscribes it (profile bridged, Follow sent)
#   - removing an entry unfollows it (Undo{Follow}; already-bridged records
#     are kept — content just stops flowing)
#   - manual POST /admin/communities subscriptions NOT listed here are
#     unfollowed at the next sweep
# Community-side consent always wins: a community advertising #nobridge is
# refused no matter what this file says.
#
# Inclusion criteria (evaluate requests against these, not vibes):
#   - active: posts within the last 30 days
#   - established moderation (named mod team, posted rules)
#   - not NSFW-primary
# Request additions or removals via GitHub issue; each entry should carry a
# comment linking its rationale.
#
# Entry format: "!name@host" or the community's AP URL ("https://host/c/name").
# NOTE: entries MUST be quoted — a bare !name@host is a YAML tag and will
# fail to parse.
communities:
  - "!comicstrips@lemmy.world"   # seed set, 2026-07: small, active, cross-checks lemmy.world
  - "!selfhosted@lemmy.world"    # seed set, 2026-07
  # added 2026-07-16 on request: large, active, established mod team.
  - "!fediverse@lemmy.world"
  # seed set, 2026-07: second instance, exercises cross-instance federation.
  # AP URL form, not "!linux@lemmy.ml": lemmy.ml has BOTH a user and a
  # community named "linux", and WebFinger acct: resolution picked the
  # Person (the materializer correctly refused it — want Group). The /c/
  # URL is unambiguous.
  - "https://lemmy.ml/c/linux"
  # added 2026-08-19 on request: third instance. Active (2.3k posts, last
  # activity this week), 3 named mods with posted rules, not NSFW.
  # acct: resolution is unambiguous here — WebFinger returns the Group.
  - "!startrek@startrek.website"
  # added 2026-09-13 on request: active gaming discussion with diverse contributors.
  - "https://lemmy.world/c/games"
  # added 2026-09-13 on request: active general-interest photos and pet discussion.
  - "https://lemmy.world/c/cat"
  # added 2026-09-13 on request: reading discussions and community challenges.
  - "https://lemmy.world/c/books"
  # added 2026-09-13 on request: active programming discussion; another source instance.
  - "https://programming.dev/c/programming"
  # added 2026-09-13 on request: maker projects and practical troubleshooting.
  - "https://lemmy.world/c/3dprinting"
  # added 2026-09-13 on request: moderated plant-care community on mander.xyz.
  - "https://mander.xyz/c/houseplants"
  # added 2026-09-13 on request: science humor alongside the existing comic community.
  - "https://mander.xyz/c/science_memes"
  # added 2026-09-13 on request: climate coverage from slrpnk.net.
  - "https://slrpnk.net/c/climate"
