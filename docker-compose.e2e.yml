# Tidepool end-to-end stack: a real Lemmy federating with the bridge, a real
# did:plc directory backing DID minting, a real atproto relay (indigo
# BigSky) crawling the bridge like a hostile consumer — DID resolution
# against the local PLC, per-commit signature verification, getRepo crawls —
# a real reference PDS (@atproto/pds) hosting a native account, and a real
# Jetstream decoding the RELAY's firehose. `make e2e` builds it,
# waits for health, runs tests/e2e (tagged `e2e`) from the host, and tears
# it down. The tested pipeline is:
#
#   Lemmy ──AP──▶ tidepool ──subscribeRepos──▶ relay (BigSky) ──▶ jetstream
#                      pds ──subscribeRepos──▶ ┘
#
# so every scenario's records transit relay validation for free. A direct
# bridge→Jetstream tap exists behind the `direct` compose profile for
# debugging only (jetstream-direct below) — it is NOT the tested path.
#
# ── BigSky facts this file depends on (verified against the pinned image's
#    --help output and the indigo source, bgs/ + cmd/bigsky/) ─────────────
# * PLC host is the `--plc-host` flag / ATP_PLC_HOST env (defaults to the
#   PUBLIC https://plc.directory — it MUST be pointed at the compose `plc`
#   service or the relay fails closed resolving our did:plc identities).
# * `--crawl-insecure-ws` (ws:// to the PDS, and http:// for requestCrawl
#   hostname validation) has NO env-var binding — it must be a command-line
#   arg. Coves' BGS_CRAWL_INSECURE_WS env var does not exist in the image
#   and is silently ignored; same for BGS_PORT and LOG_LEVEL (the real log
#   knob is BSKYLOG_LOG_LEVEL).
# * A fresh relay's slurp config has new_pds_per_day_limit = 0, and that
#   limiter is checked BEFORE the trusted-domain list — a brand-new relay
#   refuses every non-admin requestCrawl until an admin raises the limit.
#   The one-shot `relay-bootstrap` service does exactly that (and nothing
#   else): the crawl itself is still bridge-originated (RequestCrawlAll),
#   which is the thing under test.
# * requestCrawl validates the hostname by calling back into the PDS's
#   /xrpc/com.atproto.server.describeServer before subscribing — hence the
#   bridge's retrying announcement (internal/sync/crawl.go) and tidepool's
#   depends_on relay-bootstrap.
# * Handle verification: HANDLE_RESOLVER_HOSTS switches bigsky to its
#   TestHandleResolver, which GETs http://<trial-host>/.well-known/atproto-did
#   with the HANDLE in the Host header — exactly the resolution surface the
#   bridge already serves. Bridged handles (alice.lemmy.tidepool) do not
#   exist in compose DNS, so without this the prod resolver would fail —
#   which is NON-fatal in bigsky (bgs.createExternalUser logs and keeps the
#   repo with an invalid handle), but with it handles actually verify.
# * RESOLVE_ADDRESS defaults to the PUBLIC 1.1.1.1:53 resolver; pointed at
#   Docker's embedded DNS (127.0.0.11) as defense-in-depth on a dead code
#   path — NOT what makes the stack local-only. Docker's embedded DNS
#   forwards unknown names to its upstream resolver, so this alone would
#   not be hermetic; the invariant actually holds because
#   HANDLE_RESOLVER_HOSTS fully REPLACES the DNS-TXT handle resolver with
#   the TestHandleResolver (above) and ATP_PLC_HOST keeps did:plc
#   resolution on the compose plc, leaving no code path that queries DNS.
# * The image has no arm64 manifest (`platform: linux/amd64`; Apple Silicon
#   runs it under emulation — fine at e2e volume).
#
# ── How Lemmy↔Tidepool federation works over plain HTTP ──────────────────
# Lemmy only accepts http:// federation URLs in a DEBUG build (a compile-time
# property — see e2e/lemmy/Dockerfile), so the harness builds Lemmy from
# source in debug mode instead of pulling a release image. Both sides then
# live portless on :80 under their compose hostnames:
#
#   http://lemmy/...     Lemmy's AP ids (hostname "lemmy", tls_enabled false)
#   http://tidepool/...  the bridge's AP ids (BRIDGE_SCHEME=http, dev-only)
#
# Portless matters twice: Lemmy production builds reject explicit ports in
# ids (moot here, but debug keeps the same shape), and Tidepool's bridged
# handles are DNS labels under BRIDGE_HOSTNAME, so the hostname must not
# carry a port. Non-root processes can bind :80 because docker defaults
# net.ipv4.ip_unprivileged_port_start=0 in containers.
#
# No TLS/caddy layer is involved. The release-image alternative (caddy with
# an internal CA, portless https hostnames via network aliases, and the CA
# trusted inside every container) was rejected: release builds have NO
# runtime override for the local-IP/http/port federation checks — they are
# compile-time debug_assertions in the activitypub-federation crate, which
# is exactly why the debug build is required. On top of that, Lemmy's TLS
# trust store is not reliably extensible at runtime, and the proxy adds
# nothing for a local harness.
#
# Host ports (loopback-only — the stack carries admin tokens and
# ALLOW_PRIVATE_FETCH=1, so it must not be reachable from the local
# network; offset from the dev stack AND the Coves dev relay so all can run):
#   127.0.0.1:8092  Tidepool HTTP (admin API, XRPC, healthz)
#   127.0.0.1:8541  Lemmy HTTP API (8541 nods to lemmy_alpha in upstream's federation compose)
#   127.0.0.1:2480  Relay (BigSky) XRPC + admin API
#   127.0.0.1:3081  Reference PDS XRPC — PUBLISHED ON THE `relay` SERVICE (the
#                   pds shares its network namespace and so cannot publish its
#                   own ports); 3081 rather than the PDS's natural 3001
#                   because the Coves dev stack already owns 3001 here
#   127.0.0.1:6028  Jetstream WebSocket (/subscribe)
#
# LOCAL-ONLY: nothing here talks to plc.directory, public relays, or public
# Lemmy instances — the reference PDS mints its DIDs against the compose PLC
# (PDS_DID_PLC_URL) and announces itself only to the compose relay. All
# egress stays on the compose network (image pulls and build-time
# package/source downloads aside).

name: tidepool-e2e

services:
  # ── Tidepool ────────────────────────────────────────────────────────────
  tidepool-postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: tidepool
      POSTGRES_USER: tidepool
      POSTGRES_PASSWORD: tidepool
    networks: [tidepool-e2e]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tidepool -d tidepool"]
      interval: 2s
      timeout: 5s
      retries: 30

  # Production uses the same embedded migration command as this one-shot
  # service. The bridge waits for a successful exit before starting; a failed
  # migration therefore fails the stack closed instead of booting mixed code
  # and schema. Development startup still performs an idempotent migrate as a
  # convenience, but the harness exercises the deployable command explicitly.
  tidepool-migrate:
    build: .
    command: ["migrate"]
    environment:
      DATABASE_URL: postgres://tidepool:tidepool@tidepool-postgres:5432/tidepool?sslmode=disable
    networks: [tidepool-e2e]
    depends_on:
      tidepool-postgres:
        condition: service_healthy
    restart: "no"

  tidepool:
    build: .
    environment:
      # development: migrations-on-start, StrictValidation (lexicon failures
      # fail closed — exactly what a conformance harness wants), and the two
      # local-federation relaxations below are dev-gated in config.
      ENVIRONMENT: development
      DATABASE_URL: postgres://tidepool:tidepool@tidepool-postgres:5432/tidepool?sslmode=disable
      LISTEN_ADDR: ":80"
      BRIDGE_HOSTNAME: tidepool
      # Plain-HTTP AP ids so a debug-mode Lemmy can fetch/deliver to us.
      BRIDGE_SCHEME: http
      # The compose network is private address space; the SSRF guard must let
      # the bridge fetch lemmy/plc (dev-only, refused in production).
      ALLOW_PRIVATE_FETCH: "1"
      PLC_DIRECTORY_URL: http://plc:3000
      ADMIN_TOKEN: e2e-admin-token
      SEED_COUNTS_FROM_API: "1"
      # Short stats-refresh interval (default 30s) so the vote scenarios
      # actually exercise the bridged-vote-stats refresher: within ~2s of a
      # vote landing, the subject's post/comment record gains (or updates) its
      # bridgedStats field via a real UPDATE commit on the firehose. The
      # suite's zz-sweep lexicon-validates every create AND update, so the
      # synced #bridgedStats def must make those pass. Every emitted update is
      # a post/comment in the suite's expectedCollections allowlist, so no negative
      # assertion is tripped (see votes_hammer_test.go: it awaits the vote XRPC
      # counts and never asserts "no further commits").
      STATS_REFRESH_INTERVAL: 2s
      STATS_REFRESH_BATCH: "50"
      # Announce ourselves to the local relay on startup via the REAL
      # RequestCrawlAll path. ALLOW_DEV_REQUEST_CRAWL exists precisely for
      # this stack (dev is otherwise log-only, and production refuses the
      # flag); the announcement retries internally because the relay
      # validates the hostname by calling back into our describeServer.
      RELAY_HOSTS: http://relay:2470
      ALLOW_DEV_REQUEST_CRAWL: "1"
      # Short profile-refresh TTL (default 24h) so the consent e2e scenario
      # can drive the "bridged actor adds #nobridge → scrub" transition:
      # Lemmy 0.19.x never federates Update{Person} on bio edits (verified:
      # SendActivityData has no Update-Person variant at this tag), so the
      # TTL-gated re-fetch on the actor's NEXT activity is the only path by
      # which the bridge can discover a bio marker change. Harmless for the
      # other scenarios: a re-fetch that yields an unchanged profile is an
      # idempotent re-put (no commit, no firehose event).
      PROFILE_REFRESH_TTL: 2s
      # The outbound path (native Coves content → Lemmy): the Jetstream
      # consumer reads the relay-fed Jetstream, the acceptance engine admits
      # native postv2s into bridged communities, and one delivery worker
      # POSTs the Create{Page} to Lemmy. Native authors' Person actors live on
      # a SEPARATE authority (AP_USER_ORIGIN must not be BRIDGE_HOSTNAME or a
      # subdomain of it); `coves-users` is a network alias of this container,
      # so Lemmy's actor fetches reach the same listener and the host router
      # sends them to the user-origin surface.
      CONSUMER_ENABLED: "1"
      JETSTREAM_URL: ws://jetstream:6018/subscribe
      OUTBOUND_WORKERS: "1"
      AP_USER_ORIGIN: http://coves-users
      # Minting a native author's actor verifies their handle against the
      # HTTPS well-known (https://{handle}/.well-known/atproto-did). The
      # `handle-tls` service terminates that TLS with Caddy's local CA; this
      # makes the bridge trust ONLY that CA, so no public HTTPS endpoint is
      # reachable-and-trusted from inside the stack. Go's crypto/x509 reads
      # SSL_CERT_FILE in place of the bundle file list BUT still scans the
      # default directories (/etc/ssl/certs, which alpine's ca-certificates
      # fills with public roots) unless SSL_CERT_DIR replaces them too — so
      # both point at the volume, which holds nothing but the local root.
      SSL_CERT_FILE: /handle-tls-ca/root.crt
      SSL_CERT_DIR: /handle-tls-ca
      LOG_LEVEL: debug
    volumes:
      - handle-tls-ca:/handle-tls-ca:ro
    ports:
      - "127.0.0.1:${TIDEPOOL_E2E_PORT:-8092}:80"
    # Handle verification's DNS half (_atproto.{handle} TXT) must not leave
    # the stack. On a user-defined network the container's resolver stays
    # Docker's embedded DNS (127.0.0.11), which keeps answering compose
    # service names and aliases itself; `dns:` only replaces the upstream it
    # forwards EVERYTHING ELSE to (the host's resolvers by default). Pointed
    # at the in-stack `dns` service, no query reaches a host or public
    # resolver. `dns:` takes an IP, hence that service's fixed address.
    dns: [10.231.53.53]
    networks:
      tidepool-e2e:
        aliases: [coves-users]
    depends_on:
      tidepool-migrate:
        condition: service_completed_successfully
      dns:
        condition: service_started
      jetstream:
        condition: service_healthy
      handle-tls:
        condition: service_healthy
      plc:
        condition: service_healthy
      # The relay must be up AND willing to accept new PDS subscriptions
      # (see relay-bootstrap) before the bridge's startup requestCrawl fires,
      # or the announcement burns its retry budget against a 0-limit relay.
      relay-bootstrap:
        condition: service_completed_successfully
    healthcheck:
      # /healthz pings the database, so healthy == migrated and serving.
      test: ["CMD", "wget", "--spider", "-q", "http://localhost/healthz"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 20s

  # ── did:plc directory ───────────────────────────────────────────────────
  plc-postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: plc
      POSTGRES_USER: plc
      POSTGRES_PASSWORD: plc
    networks: [tidepool-e2e]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plc -d plc"]
      interval: 2s
      timeout: 5s
      retries: 30

  plc:
    build: e2e/plc
    environment:
      DATABASE_URL: postgresql://plc:plc@plc-postgres:5432/plc?sslmode=disable
      DEBUG_MODE: "1"
      LOG_ENABLED: "true"
      LOG_LEVEL: info
      LOG_DESTINATION: "1"
      NODE_ENV: development
      PORT: 3000
    networks: [tidepool-e2e]
    depends_on:
      plc-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/_health"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 30s

  # ── BigSky relay (indigo) ───────────────────────────────────────────────
  relay-postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: bgs
      POSTGRES_USER: relay
      POSTGRES_PASSWORD: relay
    volumes:
      # First-boot init: creates the second database (`carstore`) — bigsky
      # keeps BGS state and carstore shard metadata in separate databases.
      - ./e2e/relay/init-carstore.sql:/docker-entrypoint-initdb.d/init-carstore.sql:ro
    networks: [tidepool-e2e]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relay -d bgs"]
      interval: 2s
      timeout: 5s
      retries: 30

  relay:
    # Pinned bigsky build (same pin Coves uses). All flag/env names below
    # are verified against this image's --help output — see the header
    # comment for the ones that look plausible but do NOT exist.
    image: ghcr.io/bluesky-social/indigo:bigsky-0a2d4173e6e89e49b448f6bb0a6e1ab58d12b385
    # No arm64 manifest; Apple Silicon hosts run it under emulation.
    platform: linux/amd64
    # --crawl-insecure-ws has no env binding (verified): ws:// to the bridge
    # and http:// hostname validation. The image entrypoint is `dumb-init --`
    # so the command must restate the binary.
    command: ["/bigsky", "--crawl-insecure-ws"]
    environment:
      DATABASE_URL: postgresql://relay:relay@relay-postgres:5432/bgs?sslmode=disable
      CARSTORE_DATABASE_URL: postgresql://relay:relay@relay-postgres:5432/carstore?sslmode=disable
      DATA_DIR: /data
      # LOCAL-ONLY, twice over: DID resolution against the compose PLC (the
      # default is the public plc.directory), and DNS against Docker's
      # embedded resolver (the default is the public 1.1.1.1).
      ATP_PLC_HOST: http://plc:3000
      RESOLVE_ADDRESS: 127.0.0.11:53
      # Bridged handles live under the bridge hostname and resolve via the
      # bridge's own /.well-known/atproto-did (Host-header keyed) — bigsky's
      # trial-host resolver speaks exactly that. Without this, handle
      # verification fails non-fatally (repo kept, handle marked invalid).
      # Comma-separated (a StringSliceFlag): the second host is the reference
      # PDS, which serves the same well-known for its `.pds.test` handles and
      # is reachable at localhost:3001 from THIS namespace (see the `pds`
      # service). Nice-to-have, not a gate — the failure mode is non-fatal.
      HANDLE_RESOLVER_HOSTS: tidepool,localhost:3001
      RELAY_ADMIN_KEY: e2e-relay-admin-key
      # Default is 100 repos per PDS — a long-lived stack under repeated
      # suite runs mints past that.
      RELAY_DEFAULT_REPO_LIMIT: "10000"
      # Disk persister gives real event playback (with TTL) for downstream
      # cursor replay instead of the DB persister's unbounded table. Note
      # that it keeps its log-file REFS in relay-postgres while the files
      # themselves live in this container's writable layer, so recreating
      # this container alone (any edit to this service does) makes bigsky
      # exit at boot on "open /data/persister/evts-0: no such file or
      # directory". Recreate the stack with `make e2e-down` first.
      RELAY_PERSISTER_DIR: /data/persister
      BSKYLOG_LOG_LEVEL: info
    ports:
      - "127.0.0.1:${RELAY_E2E_PORT:-2480}:2470"
      # The reference PDS's port, published HERE because the `pds` service
      # runs in this container's network namespace and docker refuses
      # `ports` on a container-network-mode service — at container CREATE
      # time, which `docker compose config` does not catch. Publishing it
      # here is the same listener: in a shared namespace there is one
      # loopback and one port space (see the `pds` service header).
      - "127.0.0.1:${PDS_E2E_PORT:-3081}:3001"
    networks: [tidepool-e2e]
    depends_on:
      relay-postgres:
        condition: service_healthy
      plc:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:2470/xrpc/_health"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 30s

  # One-shot bootstrap: raise the new-PDS-per-day limit from its fresh-DB
  # default of 0 (which refuses ALL non-admin requestCrawl — checked before
  # the trusted-domain list, so there is no config-only bypass). This is the
  # sanctioned admin-API bootstrap; the crawl announcement itself still
  # comes from the bridge (the code path under test). Reuses the bigsky
  # image (has busybox wget) to avoid pulling another one.
  relay-bootstrap:
    image: ghcr.io/bluesky-social/indigo:bigsky-0a2d4173e6e89e49b448f6bb0a6e1ab58d12b385
    platform: linux/amd64
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - >-
        wget -q -O- --post-data=''
        --header='Authorization: Bearer e2e-relay-admin-key'
        'http://relay:2470/admin/subs/setPerDayLimit?limit=1000'
    restart: "no"
    networks: [tidepool-e2e]
    depends_on:
      relay:
        condition: service_healthy

  # ── Reference PDS (@atproto/pds — a repo host we did NOT write) ─────────
  #
  # Every other repo on this firehose is the bridge's: our commits, read back
  # by our own understanding of the spec at both ends, so a shared misreading
  # is invisible. This is the third party that cannot share it — a record it
  # commits crosses the same relay, the same firehose and the same Jetstream
  # as a bridged one (tests/e2e/native_pds_test.go).
  #
  # WHY IT SHARES THE RELAY'S NETWORK NAMESPACE
  # @atproto/pds derives its public URL from PDS_HOSTNAME and special-cases
  # `localhost` → http://localhost:${PDS_PORT}; ANY other hostname becomes
  # https://…, which this plain-HTTP harness cannot serve. So the DID
  # documents this PDS writes name http://localhost:3001 — and that string
  # has to be TRUE for the relay, because bigsky's createExternalUser takes
  # the service endpoint out of the DID DOCUMENT, looks the PDS peering up
  # by THAT host, and calls describeServer against THAT url from inside its
  # own namespace — special-casing a `localhost:` prefix back to http,
  # because indigo is built for exactly this topology — then refuses commits
  # from a PDS that is not authoritative for the repo. (Line numbers as of
  # indigo 8f2296e — 2025-10-10, ~11 days after the pinned image's commit:
  # bgs/bgs.go:1013-1045 createExternalUser, :1035-1037 the localhost case,
  # :823-836 the authority check. Neither the image's own commit nor the
  # indigo in go.mod is that snapshot, so treat these as landmarks to search
  # for, not addresses to trust.)
  # `network_mode: "service:relay"` makes localhost:3001 the same listener
  # for both containers, so the DID document tells the truth. The obvious
  # alternative — a `pds` hostname of its own on the compose network — fails
  # SILENTLY and expensively: the relay accepts the crawl, registers the
  # host, then logs and advances its cursor forever (bgs/fedmgr.go:556-563 at
  # the same snapshot) with RepoCount 0 and not one event delivered.
  #
  # Consequences encoded elsewhere in this file:
  #   * The host port is published on the `relay` service, not here.
  #   * `relay` must NOT depends_on this service — that is a cycle, since
  #     this service's namespace IS the relay's.
  #   * In-network callers reach this PDS at relay:3001; the crawl
  #     announcement says `localhost:3001`, because the relay keys the
  #     peering on the DID-doc host and that match IS the mechanism.
  #   * Restarting or recreating the RELAY container tears this container's
  #     networking down with it (docker cannot re-enter a namespace that
  #     was replaced) — recreate `pds` alongside it. The suite's restart
  #     scenario bounces only `tidepool`, so it is safe today.
  #
  # Unlike the relay image, this digest is multi-arch — arm64 hosts run it
  # natively and it needs no `platform:` pin.
  #
  # Expected noise, not a fault: at account creation this PDS emits a #sync
  # frame that the pinned bigsky predates, and the relay logs one
  # `ERROR failed handling event … err="invalid fed event"` for it. The
  # #identity and #account frames around it are consumed normally, the
  # handle verifies, and every #commit that follows is indexed.
  pds:
    # Pinned by digest — the SAME digest Coves' CI stack pins
    # (coves/docker-compose.ci.yml), so both repos exercise one PDS build.
    # sha256:1fa8bbce… was resolved 2026-07-28 from ghcr.io/bluesky-social/pds:latest.
    image: ghcr.io/bluesky-social/pds@sha256:1fa8bbceabb65d8e1710749b1ea92c1c20a7489ca38da4a0a5f64c0c10a70c29
    network_mode: "service:relay"
    environment:
      # localhost:3001 is a claim about the relay's namespace, not a
      # loopback-only bind — see the header. Changing either value without
      # the other breaks peering.
      PDS_HOSTNAME: localhost
      PDS_PORT: 3001
      PDS_DATA_DIRECTORY: /pds
      PDS_BLOBSTORE_DISK_LOCATION: /pds/blocks
      # LOCAL-ONLY: DIDs are minted in the compose PLC, not the public
      # plc.directory (the default). Resolved through the relay's namespace,
      # where the compose DNS name `plc` works exactly as it does elsewhere.
      PDS_DID_PLC_URL: http://plc:3000
      PDS_JWT_SECRET: e2e-pds-jwt-secret
      PDS_ADMIN_PASSWORD: e2e-pds-admin-password
      # Distinct from Coves' key: two hosts sharing a rotation key could
      # rewrite each other's identities, which is not the topology modelled.
      PDS_PLC_ROTATION_KEY_K256_PRIVATE_KEY_HEX: a65e9c570ef61d87f7a4404d3b6a4763ed537b7683d9848b9a73208689c14bda
      # `.test` is RFC-6761 reserved and can never resolve on the public
      # internet — the same reasoning as the `.invalid` fixtures in the unit
      # suite. native-alice.pds.test (the bootstrap account, and a constant
      # in tests/e2e/native_pds_test.go) lives under it.
      PDS_SERVICE_HANDLE_DOMAINS: .pds.test
      PDS_DEV_MODE: "true"
      # No invite codes, so pds-bootstrap creates its account over the plain
      # public createAccount endpoint rather than the admin API — the same
      # call any client would make.
      PDS_INVITE_REQUIRED: "false"
      NODE_ENV: development
      LOG_ENABLED: "true"
      LOG_LEVEL: info
    volumes:
      # Not durability — EXISTENCE. The image ships no /pds, and @atproto/pds
      # opens its sqlite files in PDS_DATA_DIRECTORY without creating the
      # directory first ("Cannot open database because the directory does not
      # exist", verified on this digest).
      - pds-data:/pds
    depends_on:
      # Not an ordering preference: the namespace this container joins does
      # not exist until the relay's container does.
      relay:
        condition: service_healthy
      plc:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3001/xrpc/_health"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 20s

  # One-shot: create the native test account on the reference PDS, prove its
  # credentials work, and tell the relay to crawl it.
  #
  # NOT the admin API — PDS_INVITE_REQUIRED is false, so this is the same
  # public com.atproto.server.createAccount any client would call, which is
  # the point: nothing about the native account is privileged.
  #
  # IDEMPOTENT BY CONSTRUCTION, because `make e2e-up` starts (and therefore
  # re-runs) exited one-shots, and the second run always finds the handle
  # taken. createAccount's failure is tolerated and the GATE is createSession:
  # "these credentials authenticate" is the claim worth failing the stack on,
  # and it is exactly the claim tests/e2e/native_pds_test.go opens with. It is
  # also the only claim BusyBox wget can check — it cannot read a 4xx body, so
  # "handle already taken" is indistinguishable from "the PDS rejected our
  # configuration" at the createAccount call alone.
  #
  # Then requestCrawl, which is the PUBLIC sync endpoint (no admin bearer):
  # relay-bootstrap has already raised the new-PDS-per-day limit that would
  # otherwise refuse it, and the hostname announced is `localhost:3001` —
  # the host in the DID documents this PDS writes, which is what the relay
  # keys its peering on. The relay validates it by calling describeServer
  # back at that url; no race to lose here, since `pds` is healthy first.
  # A 200 here means the relay ACCEPTED the request, which is not the same
  # as crawling: the silent RepoCount-0 mode in the `pds` header above
  # begins with exactly this 200. What proves the crawl is the smoke test's
  # pre-write relay-head poll (tests/e2e/native_pds_test.go), which demands
  # the relay already serve a head for the native repo before the scenario
  # writes anything.
  #
  # Runs in its own namespace on the compose network, so the PDS is
  # relay:3001 from here — the same listener, seen from outside.
  pds-bootstrap:
    image: ghcr.io/bluesky-social/pds@sha256:1fa8bbceabb65d8e1710749b1ea92c1c20a7489ca38da4a0a5f64c0c10a70c29
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        echo '▶ creating native-alice.pds.test on the reference PDS'
        if ! wget -q -O- --header='Content-Type: application/json' \
          --post-data='{"handle":"native-alice.pds.test","email":"native-alice@pds.test","password":"native-alice-e2e-pass"}' \
          http://relay:3001/xrpc/com.atproto.server.createAccount; then
          echo '  createAccount failed with the status above, and BusyBox wget cannot read the'
          echo '  response body — this one-shot does not know why. Benign IF the account already'
          echo '  exists, which is every re-run of the stack. If the createSession below fails'
          echo '  too, THIS was the real failure: check the pds logs for PLC reachability and'
          echo '  that the handle sits under PDS_SERVICE_HANDLE_DOMAINS.'
        fi
        echo
        echo '▶ authenticating as native-alice.pds.test (the gate)'
        wget -q -O- --header='Content-Type: application/json' \
          --post-data='{"identifier":"native-alice.pds.test","password":"native-alice-e2e-pass"}' \
          http://relay:3001/xrpc/com.atproto.server.createSession > /dev/null
        echo '  ✓ credentials valid'
        echo '▶ announcing localhost:3001 (the DID-doc host) to the relay'
        wget -q -O- --header='Content-Type: application/json' \
          --post-data='{"hostname":"localhost:3001"}' \
          http://relay:2470/xrpc/com.atproto.sync.requestCrawl
        echo '  ✓ relay accepted the crawl request'
    restart: "no"
    networks: [tidepool-e2e]
    depends_on:
      pds:
        condition: service_healthy
      # A fresh relay refuses every non-admin requestCrawl until this
      # one-shot raises new_pds_per_day_limit off its default of 0.
      relay-bootstrap:
        condition: service_completed_successfully

  # ── Handle TLS (HTTPS well-known for native handles) ─────────────────────
  # The acceptance engine verifies a native author's handle before minting
  # their AP actor: DNS TXT first (the in-stack `dns` service answers
  # `.test` with an authoritative NXDOMAIN, "no claim"), then
  # GET https://{handle}/.well-known/atproto-did. This
  # Caddy answers that name (a network alias) with a certificate from its own
  # local CA and proxies to the reference PDS, which serves the DID for the
  # handles it hosts by Host header. The CA root is copied world-readable
  # into a shared volume the bridge mounts as its ONLY trust store.
  #
  # The volume outlives the container (only `down -v` removes it) while
  # Caddy's /data — and so its CA — is the image's anonymous volume, which a
  # container created after `down` (without -v) does not inherit, so Caddy
  # mints a new CA. A root.crt left by a previous run would pass
  # the healthcheck before this Caddy's root is copied, and the bridge would
  # start trusting a CA that no longer signs anything. So the old file is
  # deleted first, and the new one lands by rename so the healthcheck never
  # sees a partial copy.
  handle-tls:
    image: caddy:2.11-alpine
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        rm -f /handle-tls-ca/root.crt /handle-tls-ca/root.crt.tmp
        cat > /etc/caddy/Caddyfile <<'CADDYFILE'
        {
          skip_install_trust
        }
        native-alice.pds.test {
          tls internal
          reverse_proxy relay:3001
        }
        CADDYFILE
        caddy run --config /etc/caddy/Caddyfile --adapter caddyfile &
        caddy_pid=$$!
        until [ -f /data/caddy/pki/authorities/local/root.crt ]; do sleep 0.2; done
        cp /data/caddy/pki/authorities/local/root.crt /handle-tls-ca/root.crt.tmp
        chmod 644 /handle-tls-ca/root.crt.tmp
        mv /handle-tls-ca/root.crt.tmp /handle-tls-ca/root.crt
        wait $$caddy_pid
    volumes:
      - handle-tls-ca:/handle-tls-ca
    networks:
      tidepool-e2e:
        aliases: [native-alice.pds.test]
    depends_on:
      pds:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "test", "-f", "/handle-tls-ca/root.crt"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

  # ── In-stack DNS (the bridge's only upstream resolver) ───────────────────
  # CoreDNS serving the `.test` zone authoritatively and answering every
  # other name NXDOMAIN; it forwards nothing. Config: tests/e2e/dns/. The
  # `log` plugin prints each query it receives, so
  # `docker compose -f docker-compose.e2e.yml logs dns` is the full list of
  # names the bridge asked about beyond compose service names. Fixed address
  # (outside the network's dynamic ip_range) because `dns:` takes an IP.
  # No healthcheck: the image is scratch-based (no shell/wget), and the
  # first TXT lookup happens long after startup.
  dns:
    image: coredns/coredns:1.14.7@sha256:7efd3c635b03efd68c4e8398fc45f0d993d0e9ab016f72c1cefb0fd6d01aa286
    command: ["-conf", "/etc/coredns/Corefile"]
    volumes:
      - ./tests/e2e/dns:/etc/coredns:ro
    networks:
      tidepool-e2e:
        ipv4_address: 10.231.53.53
    restart: "no"

  # ── Jetstream (consumes the RELAY's firehose — the tested pipeline) ─────
  jetstream:
    image: ghcr.io/bluesky-social/jetstream:sha-306e463693365e21a5ffd3ec051a5a7920000214
    # Jetstream EXITS when its upstream websocket dies. Its upstream is now
    # the relay, which stays up across the restart scenario (the RELAY
    # reconnects to the bounced bridge with its stored per-PDS cursor), so
    # the policy only matters if the relay itself dies. Docker revives it;
    # it reconnects with the cursor persisted in /data (container-local,
    # survives restarts) and resumes replay without gaps or duplicates.
    restart: unless-stopped
    environment:
      JETSTREAM_WS_URL: ws://relay:2470/xrpc/com.atproto.sync.subscribeRepos
      JETSTREAM_LISTEN_ADDR: ":6018"
      JETSTREAM_METRICS_LISTEN_ADDR: ":6019"
      JETSTREAM_DATA_DIR: /data
      JETSTREAM_EVENT_TTL: 24h
      # The stack is quiet between test steps; don't self-restart on idle.
      JETSTREAM_LIVENESS_TTL: 24h
      LOG_LEVEL: debug
    ports:
      - "127.0.0.1:${JETSTREAM_E2E_PORT:-6028}:6018"
    networks: [tidepool-e2e]
    depends_on:
      relay:
        condition: service_healthy
    # No wget/curl in the image, but it is debian-based with bash — a
    # /dev/tcp probe of the subscribe port is a real readiness gate. Without
    # a healthcheck, `up --wait` would pass the moment the container is
    # running, before Jetstream actually accepts subscribers.
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/6018"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 10s

  # Debug-only tap: Jetstream wired straight to the bridge, bypassing the
  # relay. NOT the tested path — bring it up alongside the stack with
  #   docker compose -f docker-compose.e2e.yml --profile direct up -d jetstream-direct
  # and point a listener at ws://127.0.0.1:6038 to compare the bridge's raw
  # emissions against what survives relay validation.
  jetstream-direct:
    image: ghcr.io/bluesky-social/jetstream:sha-306e463693365e21a5ffd3ec051a5a7920000214
    profiles: [direct]
    restart: unless-stopped
    environment:
      JETSTREAM_WS_URL: ws://tidepool:80/xrpc/com.atproto.sync.subscribeRepos
      JETSTREAM_LISTEN_ADDR: ":6018"
      JETSTREAM_METRICS_LISTEN_ADDR: ":6019"
      JETSTREAM_DATA_DIR: /data
      JETSTREAM_EVENT_TTL: 24h
      JETSTREAM_LIVENESS_TTL: 24h
      LOG_LEVEL: debug
    ports:
      - "127.0.0.1:${JETSTREAM_DIRECT_E2E_PORT:-6038}:6018"
    networks: [tidepool-e2e]
    depends_on:
      tidepool:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/6018"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 10s

  # ── Lemmy ───────────────────────────────────────────────────────────────
  lemmy-postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: lemmy
      POSTGRES_USER: lemmy
      POSTGRES_PASSWORD: lemmy
    networks: [tidepool-e2e]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lemmy -d lemmy"]
      interval: 2s
      timeout: 5s
      retries: 30

  pictrs:
    # Lemmy refuses to boot without a pictrs URL configured; 0.5 is the
    # pairing for lemmy 0.19 (multi-arch, runs fine on arm64).
    image: asonix/pictrs:0.5
    environment:
      PICTRS__SERVER__API_KEY: e2e-pictrs-key
    networks: [tidepool-e2e]

  lemmy:
    build: e2e/lemmy
    environment:
      RUST_LOG: "warn,lemmy_server=debug,lemmy_apub=debug,lemmy_federate=debug,activitypub_federation=debug"
      RUST_BACKTRACE: "1"
      LEMMY_CONFIG_LOCATION: /config/config.hjson
      # Without this the persistent federation queue delays deliveries by
      # 30s–5min; Lemmy's own api_tests set it too.
      LEMMY_TEST_FAST_FEDERATION: "1"
    volumes:
      - ./e2e/lemmy/lemmy.hjson:/config/config.hjson:ro
    ports:
      - "127.0.0.1:${LEMMY_E2E_PORT:-8541}:80"
    networks: [tidepool-e2e]
    depends_on:
      lemmy-postgres:
        condition: service_healthy
      pictrs:
        condition: service_started
    healthcheck:
      # /api/v3/site answers once migrations + setup (admin/site creation) ran.
      test: ["CMD", "curl", "-sf", "http://localhost/api/v3/site"]
      interval: 2s
      timeout: 5s
      retries: 60
      start_period: 60s

networks:
  tidepool-e2e:
    driver: bridge
    name: tidepool-e2e-network
    # Explicit subnet so the `dns` service can hold a fixed address (the
    # bridge's `dns:` needs an IP). 10.x sits outside Docker's default
    # auto-allocation pools (172.17-31.x, 192.168.x), so it cannot collide
    # with another compose project's network. Dynamic addresses come only
    # from ip_range (.128-.255), so no container can take .53 first.
    ipam:
      config:
        - subnet: 10.231.53.0/24
          ip_range: 10.231.53.128/25

volumes:
  # handle-tls's local CA root, shared read-only with the bridge.
  handle-tls-ca:
  # The reference PDS's repos, blobs and account database (why it must exist
  # at all: see the `pds` service's volumes). Named rather than anonymous so
  # the native account survives a `docker compose up` that recreates the
  # container — `pds-bootstrap` is idempotent either way. `make e2e` /
  # `make e2e-down` remove it with -v, in the same breath as the PLC's
  # database: the account's did:plc is minted there, so keeping one without
  # the other leaves a repo whose DID nothing can resolve, and the relay
  # rejects every commit it signs.
  pds-data:
